# Betternotes-Konfiguration (keine Geheimnisse hier – Zugangsdaten kommen aus
# GitHub Actions Secrets bzw. Umgebungsvariablen, siehe README §Einrichtung).

timezone: Europe/Berlin
send_hour: 6                      # Ziel-Uhrzeit (lokal) für die Morgen-Mail
recipient: Kira.moewes@gmail.com

# Fächer: Verbindung zwischen Untis-Kürzel und Goodnotes-Notizbüchern.
#   untis:     Fachkürzel exakt wie sie in WebUntis erscheinen (Groß/Klein egal)
#   goodnotes: Muster (fnmatch, * erlaubt) für Ordner-/Dateinamen im Drive-Backup
#   name:      Anzeigename im Digest
#   news:      true => an Tagen mit diesem Fach werden die Top-5-Nachrichten ergänzt
subjects:
  - untis: ["SW", "SOWI"]
    goodnotes: ["Sowi*", "Sozialwissenschaften*"]
    name: Sozialwissenschaften
    news: true
  - untis: ["M"]
    goodnotes: ["Mathe*", "Mathematik*"]
    name: Mathematik
  - untis: ["D"]
    goodnotes: ["Deutsch*"]
    name: Deutsch
  - untis: ["E"]
    goodnotes: ["Englisch*", "English*"]
    name: Englisch
  - untis: ["EL"]
    goodnotes: ["Ernährungslehre*", "Ernährung*"]
    name: Ernährungslehre
  - untis: ["PL"]
    goodnotes: ["Philosophie*", "Philo*"]
    name: Philosophie
  - untis: ["PH"]
    goodnotes: ["Physik*"]
    name: Physik
  - untis: ["BI"]
    goodnotes: ["Biologie*", "Bio *", "Bio.*", "Bio"]
    name: Biologie
  - untis: ["KU"]
    goodnotes: ["Kunst*"]
    name: Kunst
  - untis: ["SP"]
    goodnotes: ["Sport*"]
    name: Sport

# Fallback, falls WebUntis nicht erreichbar ist: Anzeigenamen je Wochentag.
# Der Stundenplan läuft im Zwei-Wochen-Rhythmus: "even" = gerade Kalenderwoche
# (z.B. KW 26, 28), "odd" = ungerade Kalenderwoche.
# Im Normalbetrieb kommt der Plan immer live aus WebUntis (inkl. A/B-Woche,
# Entfall und neuem Plan nach den Ferien) – dieser Block greift NUR bei
# Untis-Ausfall und muss nach einem Planwechsel (z.B. nach den Ferien) einmal
# von Hand aktualisiert werden.
fallback_week:
  even:                            # Stand: KW 26+28/2026
    mon: [Kunst, Ernährungslehre, Biologie]
    tue: [Ernährungslehre, Englisch, Deutsch]
    wed: [Philosophie, Physik, Biologie, Sozialwissenschaften]
    thu: [Sport, Englisch, Sozialwissenschaften]
    fri: [Philosophie, Englisch, Mathematik, Sport]
  odd:                             # TODO: Plan der ungeraden Wochen eintragen,
    mon: [Kunst, Ernährungslehre, Biologie]        # falls er sich unterscheidet
    tue: [Ernährungslehre, Englisch, Deutsch]      # (aktuell: Kopie der geraden
    wed: [Philosophie, Physik, Biologie, Sozialwissenschaften]  # Woche)
    thu: [Sport, Englisch, Sozialwissenschaften]
    fri: [Philosophie, Englisch, Mathematik, Sport]

drive:
  backup_folder: "GoodNotes"      # Name des Auto-Backup-Ordners in Google Drive

news:
  days_back: 7
  count: 5
  rss_fallbacks:
    - https://newsfeed.zeit.de/index
    - https://rss.dw.com/rdf/rss-de-all

max_pages_per_file: 12            # jüngste Seiten je geänderter Datei für die Analyse
model: claude-sonnet-5            # Anthropic-Modell für OCR + Zusammenfassungen
