[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "betternotes"
version = "0.1.0"
description = "Täglicher Lern-Digest aus Goodnotes-Backups und dem Untis-Stundenplan"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "dropbox>=12.0",
    "webuntis>=0.1.22",
    "PyMuPDF>=1.24",
    "Jinja2>=3.1",
    "weasyprint>=61",
    "feedparser>=6.0",
    "httpx>=0.27",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "markdown>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
betternotes = "betternotes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
